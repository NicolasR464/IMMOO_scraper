[project]
name = "estate-scraper"
version = "0.1.0"
description = "Real estate listing scraper for Fontainebleau/Avon writing to Google Sheets"
requires-python = ">=3.11"

dependencies = [
  "beautifulsoup4>=4.12.0",
  "fastapi>=0.141.1",
  "google-auth>=2.56.3",
  "google-genai>=0.1.0",
  "gspread>=6.0.0",
  "gspread-formatting>=1.2.1",
  "httpx>=0.28.1",
  "pandas>=2.2.0",
  "playwright>=1.62.0",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.15.0",
  "python-dotenv==1.2.2",
  "requests>=2.31.0",
  "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
  "poethepoet>=0.38.0",
  "ruff>=0.16.0",
  "vulture>=2.14",
]

[tool.uv]
package = false

[tool.poe.tasks]
scrape = "uv run python -m src.cli"



[tool.pyright]
extraPaths = ["."]
