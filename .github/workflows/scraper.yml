name: Immoo — a Real Estate Listing Scraper

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Proto
        uses: moonrepo/setup-proto@v1
        with:
          auto-install: true

      - name: Install Dependencies
        run: |
          uv sync --frozen
          uv pip install -e .

      - name: Run Quality Suite
        run: uv run poe quality

      - name: Execute Scraper Pipeline
        env:
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: uv run poe scrape

      - name: Commit Updated CSV
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add ADs_list.csv
          git diff --staged --quiet || (git commit -m "update: refresh real estate listings" && git push)